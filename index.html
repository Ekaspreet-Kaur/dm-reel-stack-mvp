<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DM Reel Stack – MVP</title>

  <!-- CSS -->
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/chat.css" />
  <link rel="stylesheet" href="./css/reelStack.css" />
  <link rel="stylesheet" href="./css/animations.css" />
</head>

<body>
  <div id="app">

    <div class="app-frame">

      <!-- HEADER -->
      <header class="app-header">
        <div class="header-left">
          <img src="./assets/icons/back.svg" class="icon hidden" id="backBtn">
          <span class="header-title" id="headerTitle">Chats</span>
        </div>

        <div class="header-right">
          <img src="./assets/icons/more.svg" class="icon">
        </div>
      </header>

      <!-- MAIN -->
      <main id="mainView">

        <section id="chatView" class="view active">
          <div class="chat-container" id="chatContainer"></div>

          <div class="chat-input-bar">
            <input type="text" placeholder="Message..." disabled />
            <img src="./assets/icons/send.svg" class="icon disabled">
          </div>
        </section>

        <section id="reelStackView" class="view hidden">
          <div class="reel-stack-container" id="reelStackContainer"></div>
        </section>

      </main>

    </div>

  </div>

  <script src="./js/data.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/chatView.js"></script>
  <script src="./js/reelStackView.js"></script>
  <script src="./js/reelPlayer.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/app.js"></script>

</body>
</html>
